<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101c" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Rewind / Analysis circular orbit in emerald -->
  <path d="M 16 32 A 18 18 0 1 1 32 50" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.75" />
  <circle cx="16" cy="32" r="2.5" fill="#34d399" />

  <!-- Base of Chess Knight -->
  <rect x="18" y="47" width="28" height="3.5" rx="1.5" fill="#cbd5e1" />

  <!-- Chess Knight piece body -->
  <path d="M42 47 C41.5 40 40 33 37 25 C35 20 33 16 31 13 C30.5 12 29.5 12 29 13 C28.5 14 28 17 26 18 C24 19 21 21 18 24 C16.5 25.5 16 27.5 17 29.5 C18 31 20 31.5 22 30.5 C24 29.5 26 31 27 34 C28.5 38.5 27 43 23 47 Z" fill="#f8fafc" />

  <!-- Knight eye in emerald -->
  <circle cx="25.5" cy="23" r="1.8" fill="#10b981" />
  <circle cx="25.2" cy="22.7" r="0.7" fill="#ffffff" />

  <!-- Analysis review badge in top-right -->
  <circle cx="48" cy="16" r="4.5" fill="url(#emeraldGrad)" />
  <path d="M48 13.5 L49 15.5 L51 16 L49 16.5 L48 18.5 L47 16.5 L45 16 L47 15.5 Z" fill="#ffffff" />
</svg>
